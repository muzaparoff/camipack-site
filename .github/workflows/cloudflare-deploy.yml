name: Deploy to Cloudflare

# Every push to main (release notes from the app pipeline, launch and icon updates, hand edits) goes live on Cloudflare.
# Needs the repo secret CLOUDFLARE_API_TOKEN (a Cloudflare "Edit Cloudflare Workers" token).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the Worker with its static files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 62aa1dbf67360b8cfc62d51d48cc50d9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set: nothing deployed"
            exit 0
          fi
          npx --yes wrangler@4.166.0 deploy
